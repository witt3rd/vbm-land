# Tier 1 runs on a push to main only: the lander already ran it locally on the exact combination, so this is the independent check
# that defines "main is red" (README 4.4). Hosted minutes are budgeted: no pull_request trigger.
name: ci
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  tier1:
    runs-on: [self-hosted, fleet]   # private phase only: back to ubuntu-latest before going public (.github/visibility, tests/lint.sh)
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Tier 1
        run: tests/run.sh
