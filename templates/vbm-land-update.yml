# Is this repository's pinned copy of vbm-land intact, and is a newer release out? Weekly and on dispatch. Read-only: it changes nothing.
# A separate workflow from the gate (LAND_CI_WORKFLOW), so a failure here can never make the base branch "red" and block landing: it is a visible reminder, not a gate.
# The update itself is yours: run the update-vbm-land skill (scripts/land/bin/land-update <tag>). A private source needs a read token in the secret VBM_LAND_TOKEN.
name: vbm-land-update
on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.VBM_LAND_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Drift check (the vendored copy is exactly its pin, and the source confirms the pin)
        run: scripts/land/bin/land-check --upstream
      - name: Is a newer release out?
        run: scripts/land/bin/land-update --check
