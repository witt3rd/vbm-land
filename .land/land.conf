# This repository's own landing configuration (read by bin/land-direct from main; every key is documented in lib/conf.sh).
LAND_BASE=main
# Tier 1 = lints + the whole test suite on the rebased combination (about half a minute).
LAND_TEST_CMD=tests/run.sh
LAND_CONVENTIONAL=1
# The gate-defining set: the lander, its libraries and its own config. A fix that passes a freeze may touch only tests and CI, never the protected set.
# MANIFEST.sha256 is generated from the files consumers vendor: regenerated on every rebased tree, so two changes that each updated it cannot disagree.
LAND_GENERATED_LIST=scripts/generated.txt
LAND_REGEN_CMD=bin/land-manifest
LAND_GEN_CMD=bin/land-manifest
# A changelog is read by no check; the release candidate audits this (a deleted CHANGELOG.md would fail tests/test_signing.sh there).
LAND_INERT=CHANGELOG.md
# The release candidate: the full suite land-release runs on the exact HEAD before any tag (README 4.8): Tier 1 on a scratch clone with a real approval, then 20 landers at once.
LAND_RC_CMD=tests/acceptance.sh --soak
LAND_RC_TIMEOUT=3600
