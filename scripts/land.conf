# This repository's own landing configuration (read by bin/land-direct from main; every key is documented in lib/conf.sh).
LAND_BASE=main
LAND_CI_WORKFLOW=ci.yml
LAND_TIER1_JOB=tier1
LAND_RED_MODE=push
# Tier 1 = lints + the whole test suite on the rebased combination (about half a minute).
LAND_TEST_CMD=tests/run.sh
# Size budget: production code is the tool itself.
LAND_PROD_PATHS=bin lib scripts
LAND_BUDGET_LINES=150
LAND_CONVENTIONAL=1
# The gate-defining set: the lander, its libraries and its own config. A fix for a red main may touch only tests and CI, never the protected set.
LAND_PROTECTED=bin/* lib/* scripts/*
LAND_FIX_PATHS=tests/* .github/*
# MANIFEST.sha256 is generated from the files consumers vendor: regenerated on every rebased tree, so two changes that each updated it cannot disagree.
LAND_GENERATED_LIST=scripts/generated.txt
LAND_REGEN_CMD=bin/land-manifest
LAND_GEN_CMD=bin/land-manifest
